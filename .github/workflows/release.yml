name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/taskii-${GOOS}-${GOARCH}${ext}"
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X github.com/parsaenami/taskii/internal/ui.Version=${version}" -o "$out" .
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "taskii-${GOOS}-${GOARCH}.zip" "taskii-${GOOS}-${GOARCH}${ext}")
          else
            (cd dist && tar -czf "taskii-${GOOS}-${GOARCH}.tar.gz" "taskii-${GOOS}-${GOARCH}${ext}")
          fi
      - name: Package Linux AppImage
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils zsync
          case "$GOARCH" in
            amd64) arch=x86_64 ;;
            arm64) arch=aarch64 ;;
          esac
          # Pin both pieces; appimagetool otherwise downloads the latest runtime.
          export APPIMAGETOOL="$RUNNER_TEMP/appimagetool.AppImage"
          export APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime-$arch"
          curl --fail --location --retry 3 --output "$APPIMAGETOOL" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage"
          curl --fail --location --retry 3 --output "$APPIMAGE_RUNTIME" \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$arch"
          chmod +x "$APPIMAGETOOL"
          bash scripts/build-appimage.sh "dist/taskii-linux-$GOARCH" "$GOARCH" "$GITHUB_REF_NAME" dist
      - name: Verify Linux AppImage
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          image="$PWD/dist/taskii-linux-$GOARCH.AppImage"
          expected="gh-releases-zsync|parsaenami|taskii|latest|taskii-linux-$GOARCH.AppImage.zsync"
          test "$("$image" --appimage-updateinformation)" = "$expected"
          # Extraction is also the documented FUSE-free launch path.
          test "$("$image" --appimage-extract-and-run --version)" = "taskii ${GITHUB_REF_NAME#v}"
          "$image" --appimage-extract-and-run --help
          test -s "$image.zsync"
      - uses: actions/upload-artifact@v4
        with:
          name: taskii-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.AppImage.zsync

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
