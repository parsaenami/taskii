name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/taskii-${GOOS}-${GOARCH}${ext}"
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X taskii/internal/ui.Version=${version}" -o "$out" .
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "taskii-${GOOS}-${GOARCH}.zip" "taskii-${GOOS}-${GOARCH}${ext}")
          else
            (cd dist && tar -czf "taskii-${GOOS}-${GOARCH}.tar.gz" "taskii-${GOOS}-${GOARCH}${ext}")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: taskii-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
